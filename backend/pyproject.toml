[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-ops-platform"
version = "0.1.0"
description = "AI Customer Operations Platform"
authors = [{ name = "Customer Ops Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "pyjwt[crypto]>=2.8.0",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "redis>=5.0.0",
    "celery>=5.3.6",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]
